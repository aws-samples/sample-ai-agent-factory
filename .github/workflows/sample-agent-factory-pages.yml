name: Docs Site Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '*/README.md'
      - 'assets/**'
      - 'docs-site/**'
      - 'Agentic-ai-self-service/docs/**'
      - 'Agentic-ai-self-service/CHANGELOG.md'
      - 'enterprise-mcp-governance-gateway/connectors/**'
      - 'enterprise-mcp-governance-gateway/policies/**'
      - 'workshop-building-agentic-ai-platform/source/**/*.ipynb'
      - 'workshop-building-agentic-ai-platform/source/module-3a-mcp-registry/deploy-registry.sh'
      - 'workshop-building-agentic-ai-platform/scripts/verify-s3-owner-guards.py'
      - 'workshop-building-agentic-ai-platform/scripts/live-test-s3-owner-guards.sh'
      - 'workshop-building-agentic-ai-platform/content/**'
      - 'workshop-building-agentic-ai-platform/static/img/**'
      - 'enterprise-agentic-ai-platform-blueprint/assets/**'
      - 'enterprise-agentic-ai-platform-blueprint/blueprints/**'
      - 'enterprise-agentic-ai-platform-blueprint/packages/**'
      - '.github/workflows/sample-agent-factory-pages.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '*/README.md'
      - 'assets/**'
      - 'docs-site/**'
      - 'Agentic-ai-self-service/docs/**'
      - 'Agentic-ai-self-service/CHANGELOG.md'
      - 'enterprise-mcp-governance-gateway/connectors/**'
      - 'enterprise-mcp-governance-gateway/policies/**'
      - 'workshop-building-agentic-ai-platform/source/**/*.ipynb'
      - 'workshop-building-agentic-ai-platform/source/module-3a-mcp-registry/deploy-registry.sh'
      - 'workshop-building-agentic-ai-platform/scripts/verify-s3-owner-guards.py'
      - 'workshop-building-agentic-ai-platform/scripts/live-test-s3-owner-guards.sh'
      - 'workshop-building-agentic-ai-platform/content/**'
      - 'workshop-building-agentic-ai-platform/static/img/**'
      - 'enterprise-agentic-ai-platform-blueprint/assets/**'
      - 'enterprise-agentic-ai-platform-blueprint/blueprints/**'
      - 'enterprise-agentic-ai-platform-blueprint/packages/**'
      - '.github/workflows/sample-agent-factory-pages.yml'
  workflow_dispatch:

# Pull request runs are superseded by newer pushes to the same branch.
# A production deploy (push to main or manual dispatch) is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify S3 bucket owner guards
        working-directory: workshop-building-agentic-ai-platform
        run: |
          bash -n source/module-3a-mcp-registry/deploy-registry.sh
          bash -n scripts/live-test-s3-owner-guards.sh
          python3 scripts/verify-s3-owner-guards.py

      - name: Setup Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: docs-site/.nvmrc
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same gate as `npm run audit` (npm audit --audit-level=high) plus the repository's narrow expiring
      # allowlist for advisories with no patched release (.github/npm-audit-allowlist.json). The gates'
      # own self-tests run first so a regression in a gate can never pass as a clean audit (the
      # bundle-check cases build real mini projects with this site's Vite).
      - name: Audit gate self-test
        run: |
          node --test \
            "$GITHUB_WORKSPACE/.github/scripts/npm-audit-allowlist.test.mjs" \
            "$GITHUB_WORKSPACE/.github/scripts/npm-audit-allowlist-bundle-check.test.mjs"

      - name: Audit dependencies
        run: node "$GITHUB_WORKSPACE/.github/scripts/npm-audit-allowlist.mjs" --level high

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # The allowlist's premise is that an exempted advisory lives only in build tooling, which npm's
      # dev/prod classification cannot prove. The site's own client build (the only bundle a browser loads;
      # the SSR bundle runs at build time to prerender) is re-run into a scratch directory with a recording
      # plugin, every chunk's resolved modules are attributed to their package, and the prerendered dist/
      # must consist only of those chunks (same bytes), scripts pinned in .github/npm-audit-allowlist.json
      # and documents whose inline scripts (the hash shim, the redirect stubs) are pinned there. Modules
      # anywhere in this repository are first-party; anything else fails closed.
      - name: Allowlisted advisories must be absent from the shipped bundle
        run: |
          node "$GITHUB_WORKSPACE/.github/scripts/npm-audit-allowlist-bundle-check.mjs" \
            --out "$RUNNER_TEMP/bundle-graph" --first-party-root "$GITHUB_WORKSPACE" --verify-dist dist

      - name: Validate static artifact
        run: npm run validate:static

      - name: Upload built site for the browser gates
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: docs-site/dist
          if-no-files-found: error
          retention-days: 3

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs-site/dist

  browser-gates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v7.0.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: docs-site/.nvmrc
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download built site
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: docs-site/dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser gates (axe with colour contrast, behaviour, content)
        run: npm run test:browser

      - name: Upload Playwright report
        if: failure()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: docs-site/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results (traces and screenshots)
        if: failure()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results
          path: docs-site/test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [build, browser-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
