# CI for the Agentic-ai-self-service sample (the AgentCore Visual Workflow Platform).
#
# Location matters and is easy to get wrong here. `sample-ai-agent-factory` is a
# monorepo of four independent samples, and GitHub Actions only reads workflows from
# `.github/workflows/` at the REPOSITORY ROOT — a workflow committed under
# `Agentic-ai-self-service/.github/workflows/` is never picked up, silently. Hence
# this file lives at the root, is named for the sample it covers, and every path
# below is root-relative. The `paths:` filter keeps a change to one of the other
# three samples from running this.
#
# The export-gate job is the reason the file exists at all. This sample's only
# customer-facing artifact is the CloudFormation bundle produced by
# backend/src/app/services/cfn_template_generator.py, and until recently nothing
# validated it: no cfn-lint, no policy scan, and only two of 118 backend test files
# mentioned the generator, both incidentally. That is how an entire gateway provider
# went unhandled without a failing test. It runs as its own job so a red export gate
# reads as "the thing we ship is broken" rather than as one line in a 2000-test
# summary.
#
# No AWS credentials are used anywhere here. Everything is static analysis over
# generated text, which is what makes it safe to run on pull requests from forks.

name: Agentic-ai-self-service CI

on:
  push:
    branches: [main]
    paths:
      - "Agentic-ai-self-service/**"
      - ".github/workflows/agentic-ai-self-service-ci.yml"
  pull_request:
    paths:
      - "Agentic-ai-self-service/**"
      - ".github/workflows/agentic-ai-self-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Read by backend/tests/test_cfn_export_contract.py::_require_scanner: a missing
  # cfn-lint or checkov must fail the build rather than quietly report "skipped".
  CI: "true"

defaults:
  run:
    # Everything in this workflow is scoped to the one sample. ruff.toml,
    # .pre-commit-config.yaml and the Makefile all live here, so running from the
    # repository root would pick up a different (or no) configuration.
    working-directory: Agentic-ai-self-service

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Installed by exact version rather than via astral-sh/ruff-action, for two
      # reasons: the version must equal the pin in backend/pyproject.toml's dev extra
      # (a formatter's output changes between minor releases, so a floating version
      # means `ruff format --check` here can disagree with a developer's local run
      # while both are "satisfied"), and running it as a plain step from this
      # directory reproduces `make lint` exactly, including ruff.toml discovery.
      - name: Install ruff at the pinned version
        run: pip install 'ruff==0.16.4'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  secret-scan:
    name: detect-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Must equal the `rev:` of the detect-secrets hook in .pre-commit-config.yaml. The
      # plugin set and its hashing change between releases, so a floating version means
      # this job and a developer's hook disagree about what the baseline covers.
      - name: Install detect-secrets at the pre-commit pinned version
        run: pip install 'detect-secrets==1.5.0'
      # This gate existed only as a pre-commit hook, and `pre-commit install` is manual,
      # so on a fresh clone it ran nowhere: not on commit, and not here. That is how the
      # baseline came to match nothing without anybody noticing.
      #
      # Run from the repository root, overriding this workflow's default
      # working-directory, because that is where pre-commit runs its hooks and therefore
      # the only directory in which the baseline's paths resolve.
      - name: Baseline paths must resolve where the scan runs
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, sys
          p = "Agentic-ai-self-service/.secrets.baseline"
          bad = [k for k in json.load(open(p))["results"]
                 if not k.startswith("Agentic-ai-self-service/")]
          if bad:
              sys.exit(
                  f"{len(bad)} baseline key(s) are not repository-root-relative, e.g. "
                  f"{bad[0]!r}. detect-secrets resolves result keys against its own "
                  "working directory, so these match no scanned file: the baseline loads "
                  "without error and suppresses nothing. Regenerate from the repository "
                  "root, never from inside the sample."
              )
          PY
      - name: Scan every tracked file in the sample
        working-directory: .
        run: |
          git ls-files -z Agentic-ai-self-service \
            | xargs -0 detect-secrets-hook \
                --baseline Agentic-ai-self-service/.secrets.baseline

  release-contract:
    name: release contract and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install exact contract-test dependencies
        run: pip install 'pytest==9.1.1' 'PyYAML==6.0.3'
      - name: Validate release JSON
        run: |
          python3 -m json.tool release/production-readiness-controls.json >/dev/null
          python3 -m json.tool release/production-readiness-traceability.json >/dev/null
          python3 -m json.tool release/agentcore-regions.json >/dev/null
      - name: Enforce Region, downloadable-asset, documentation, and workflow contracts
        run: python3 -m pytest backend/tests/test_release_documentation_contract.py -q

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Agentic-ai-self-service/backend/pyproject.toml
      - name: Install backend with dev extras
        run: pip install -e './backend[dev]'
      # Two reproducibility tests execute a real sdist build and intentionally fail
      # when uv is absent. Pin the same version used by the certified local release
      # environment so CI exercises that contract instead of skipping or drifting.
      - name: Install uv at the certified version
        run: python -m pip install 'uv==0.10.8'
      # "not integration" matches `make test-backend`: the integration marker is for
      # tests that make real AWS calls, which have no credentials here.
      #
      # "not policy_scan" because this job installs ./backend[dev] and checkov is
      # deliberately not in it — it pins an older boto3 and co-installing it silently
      # swaps the rule set the accepted-findings baseline was recorded against. Those
      # tests hard-fail rather than skip when CI is set, which is correct for the job
      # that owns the gate (export-gate, below) and guaranteed failure here.
      - name: Run backend suite
        working-directory: Agentic-ai-self-service/backend
        run: python3 -m pytest -m "not integration and not policy_scan and not terraform_scan and not shell_scan" -q

  export-gate:
    name: exported bundle contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Agentic-ai-self-service/backend/pyproject.toml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.6"
          terraform_wrapper: false
      - name: Install backend with dev extras
        run: pip install -e './backend[dev]'
      # Isolated, and pinned exactly. checkov pins `boto3==1.35.49` while the backend
      # requires `boto3>=1.43.66`, so installing it into the same environment makes pip
      # backtrack to an older checkov with a different rule set — silently, since it
      # resolves rather than erroring. pipx gives it its own virtualenv and puts the
      # console script on PATH, which is where the test looks for it. The exact pin is
      # because the accepted-findings baseline in
      # backend/tests/test_cfn_export_contract.py is a property of one rule set;
      # bumping this means re-validating that baseline.
      - name: Install checkov in isolation
        run: pipx install 'checkov==3.3.1'
      - name: Install ShellCheck 0.11.0 from its verified official artifact
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/shellcheck-bin"
          mkdir -p "$install_dir"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  '"$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" \
            -C "$install_dir" \
            --strip-components=1 \
            shellcheck-v0.11.0/shellcheck
          actual_version="$("$install_dir/shellcheck" --version | awk '$1 == "version:" {print $2}')"
          [[ "$actual_version" == "0.11.0" ]]
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install actionlint at the certified version
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  '"$archive" \
            | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      # Fail loudly and early rather than letting the test-level guard report it, so a
      # dependency-resolution problem is not mistaken for a template problem.
      - name: Confirm the scanners are present
        run: |
          cfn-lint --version
          checkov --version
          terraform version
          shellcheck --version
          actionlint -version
      - name: Contract, lint and policy gates over the emitted bundle
        working-directory: Agentic-ai-self-service/backend
        run: |
          python3 -m pytest \
            tests/test_downloadable_asset_contract.py \
            tests/test_python_exporter.py \
            tests/test_cfn_export_contract.py \
            tests/test_the_exported_template_can_actually_deploy.py \
            tests/test_export_bundle_staging.py \
            tests/test_export_bundle_isolation.py \
            tests/test_litellm_secret_region_is_enforced_in_the_template.py \
            tests/test_release_documentation_contract.py \
            tests/test_ci_workflow_gates.py \
            tests/test_ci_supply_chain_and_strict_synth.py \
            -q \
            --junit-xml="$RUNNER_TEMP/export-gate.xml"
      - name: Validate the repository workflow
        working-directory: .
        run: actionlint .github/workflows/agentic-ai-self-service-ci.yml
      # Uploaded on failure only: the JUnit XML names which component combination
      # broke, which is the first thing anybody debugging this will want.
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: export-gate-results
          path: ${{ runner.temp }}/export-gate.xml
          if-no-files-found: warn

  strict-synth:
    name: strict synth (${{ matrix.region }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:
          - us-east-1
          - us-east-2
          - us-west-2
          - eu-central-1
          - eu-west-1
          - eu-west-2
          - eu-west-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Agentic-ai-self-service/infra/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Agentic-ai-self-service/infra/package-lock.json
      - name: Install exact Python synth dependencies
        working-directory: Agentic-ai-self-service/infra
        run: python3 -m pip install --requirement requirements.txt
      - name: Install the repository-pinned CDK CLI
        working-directory: Agentic-ai-self-service/infra
        run: npm ci
      - name: Strict production synth without AWS lookups
        working-directory: Agentic-ai-self-service/infra
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          CDK_DISABLE_VERSION_CHECK: "true"
        run: |
          set -euo pipefail
          region="${{ matrix.region }}"
          output="$RUNNER_TEMP/strict-synth-$region"
          isolated_home="$RUNNER_TEMP/strict-synth-home-$region"
          isolated_tmp="$RUNNER_TEMP/strict-synth-tmp-$region"
          mkdir -p "$output" "$isolated_home/.cdk" "$isolated_tmp"
          export HOME="$isolated_home"
          export CDK_HOME="$isolated_home/.cdk"
          export TMPDIR="$isolated_tmp"
          export TMP="$isolated_tmp"
          export TEMP="$isolated_tmp"
          export CDK_PYTHON
          CDK_PYTHON="$(command -v python3)"
          ./node_modules/.bin/cdk synth \
            --strict \
            --quiet \
            --no-lookups \
            --output "$output" \
            -c environment_name=production \
            -c aws_region="$region" \
            -c project_name=acf
          test -f "$output/acf-production.template.json"

  infra:
    name: cdk assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Agentic-ai-self-service/infra/requirements-dev.txt
      # requirements-dev.txt includes requirements.txt and adds pytest. Installing
      # only the latter is what made this job fail with `No module named pytest`
      # rather than run the 118 assertions it exists to run.
      # Several CDK assertions read the backend they grant for (route parity, the owner
      # tag the backend stamps, the ownership getters), so they import ``app``. The
      # certified local environment carries the backend; this job did not, and those
      # tests failed with ModuleNotFoundError while the suite was green on every laptop.
      # Backend first, so the exact infra pins below win any shared dependency.
      - name: Install the backend the cross-layer assertions import
        working-directory: Agentic-ai-self-service
        run: pip install -e ./backend
      - name: Install infra requirements
        working-directory: Agentic-ai-self-service/infra
        run: pip install -r requirements-dev.txt
      - name: Run CDK assertion tests
        working-directory: Agentic-ai-self-service/infra
        run: python3 -m pytest tests/ -q

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Agentic-ai-self-service/frontend/package-lock.json
      - name: Install
        working-directory: Agentic-ai-self-service/frontend
        run: npm ci
      - name: Audit dependencies
        working-directory: Agentic-ai-self-service/frontend
        run: npm audit --audit-level=high
      - name: Lint
        working-directory: Agentic-ai-self-service/frontend
        run: npx eslint .
      - name: Test
        working-directory: Agentic-ai-self-service/frontend
        run: npx vitest --run
      # Catches the failure mode the tests do not: a type error or a broken import
      # that only surfaces when Vite actually builds.
      - name: Build
        working-directory: Agentic-ai-self-service/frontend
        env:
          VITE_API_BASE_URL: https://frontend.example.invalid
          VITE_AWS_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: us-east-1_CiFixture
          VITE_COGNITO_CLIENT_ID: ci-fixture-client
        run: npm run build
      - name: Verify production bundle
        working-directory: Agentic-ai-self-service/frontend
        env:
          VITE_API_BASE_URL: https://frontend.example.invalid
          VITE_AWS_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: us-east-1_CiFixture
          VITE_COGNITO_CLIENT_ID: ci-fixture-client
        run: npm run verify:production-build
