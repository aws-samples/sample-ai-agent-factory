<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Agent Factory: enterprise agentic AI samples for AWS with Amazon Bedrock and Amazon Bedrock AgentCore" />
    <meta name="theme-color" content="#0B1220" />
    <title>AI Agent Factory</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B1220'/%3E%3Cpath d='M8 16h16M16 8v16' stroke='%232563EB' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <!-- hash-shim -->
    <script>
      (function () {
        // Legacy hash-router shim: "/#/security" becomes "/reference/security/".
        // Only hashes that start with "#/" are touched, so in-page anchors keep working.
        var hash = window.location.hash;
        if (!hash || hash.indexOf('#/') !== 0) return;
        var renamed = {
          '/choose-a-path': '/start/which-project/',
          '/how-it-works': '/concepts/agent-factory/',
          '/capabilities': '/concepts/capability-contracts/',
          '/architecture': '/concepts/architecture/',
          '/security': '/reference/security/',
          '/getting-started': '/start/'
        };
        var rest = hash.slice(1);
        var query = rest.indexOf('?');
        var pathname = query === -1 ? rest : rest.slice(0, query);
        pathname = pathname.replace(/\/+$/, '') || '/';
        var target = renamed[pathname] || (pathname === '/' ? '/' : pathname + '/');
        var base = '%BASE_URL%'.replace(/\/$/, '');
        window.location.replace(base + target);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
