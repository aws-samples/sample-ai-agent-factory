<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Completing authorization…</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 640px;
           margin: 3rem auto; padding: 0 1rem; color: #1a1a2e; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 1.25rem; margin-top: 1rem; }
    .status { padding: .5rem .75rem; border-radius: 6px; font-size: .95rem; margin: .5rem 0; }
    .ok { background: #e7f7ec; color: #146c2e; }
    .info { background: #eef2ff; color: #26408b; }
    .err { background: #fdecec; color: #b3261e; white-space: pre-wrap; }
    #log { margin-top: 1rem; font-size: .8rem; color: #585b70; white-space: pre-wrap;
           background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: .6rem;
           max-height: 220px; overflow: auto; }
  </style>
</head>
<body>
  <h1>Completing authorization…</h1>
  <div class="card"><div id="status" class="status info">Finalizing your access…</div></div>
  <div id="log"></div>

<script type="module">
// AWS SDK v3 browser builds, loaded from jsDelivr and PINNED to an exact version.
// A bare "/+esm" URL resolves to whatever is latest at page load, which would let an
// upstream release — or a compromised publish — change the code running in this consent
// flow without any change here. Bump this version deliberately after testing.
import {
  CognitoIdentityClient, GetIdCommand, GetCredentialsForIdentityCommand,
} from "https://cdn.jsdelivr.net/npm/@aws-sdk/client-cognito-identity@3.1096.0/+esm";
import {
  BedrockAgentCoreClient, CompleteResourceTokenAuthCommand,
} from "https://cdn.jsdelivr.net/npm/@aws-sdk/client-bedrock-agentcore@3.1096.0/+esm";

const log = (m) => { document.getElementById("log").textContent += m + "\n"; };
const setStatus = (cls, msg) => { const s = document.getElementById("status"); s.className = "status " + cls; s.textContent = msg; };

async function main() {
  const cfg = await (await fetch("./config.json", { cache: "no-store" })).json();
  const sessionId = new URL(window.location.href).searchParams.get("session_id");
  const accessToken = localStorage.getItem("auth_flow_access_token");
  const idToken = localStorage.getItem("auth_flow_id_token");
  const provider = localStorage.getItem("auth_flow_provider") || "";
  const label = (cfg.providers[provider] && cfg.providers[provider].label) || provider || "the provider";

  if (!sessionId) { setStatus("err", "No session_id in the callback URL."); return; }
  if (!accessToken || !idToken) {
    setStatus("err", "Sign-in tokens not found. Start again from the authorize page.");
    return;
  }

  const loginKey = `cognito-idp.${cfg.region}.amazonaws.com/${cfg.userPoolId}`;
  const ci = new CognitoIdentityClient({ region: cfg.region });

  // 1) Exchange the ID token for a Cognito Identity, then temp AWS creds.
  log("Getting Cognito Identity…");
  const { IdentityId } = await ci.send(new GetIdCommand({
    IdentityPoolId: cfg.identityPoolId, Logins: { [loginKey]: idToken },
  }));
  log("Getting temporary AWS credentials…");
  const { Credentials } = await ci.send(new GetCredentialsForIdentityCommand({
    IdentityId, Logins: { [loginKey]: idToken },
  }));
  if (!Credentials || !Credentials.AccessKeyId || !Credentials.SecretKey || !Credentials.SessionToken) {
    setStatus("err", "Invalid credentials from Identity Pool."); return;
  }

  // 2) Complete the 3LO binding. Cognito returns `SecretKey`; the SDK wants
  //    `secretAccessKey`. Use the ACCESS token as userToken (must match the token
  //    that created the session in the probe on the authorize page).
  log("Completing authorization (CompleteResourceTokenAuth)…");
  const ac = new BedrockAgentCoreClient({
    region: cfg.region,
    credentials: {
      accessKeyId: Credentials.AccessKeyId,
      secretAccessKey: Credentials.SecretKey,
      sessionToken: Credentials.SessionToken,
    },
  });
  await ac.send(new CompleteResourceTokenAuthCommand({
    sessionUri: sessionId,
    userIdentifier: { userToken: accessToken },
  }));

  // 3) Clean up the one-time flow tokens.
  ["auth_flow_access_token", "auth_flow_id_token", "auth_flow_provider"].forEach((k) => localStorage.removeItem(k));
  setStatus("ok", `✓ Authorized for ${label}. You can close this tab and return to Kiro — the tools now return your data.`);
}

main().catch((e) => setStatus("err", "Authorization failed:\n" + String(e && e.stack || e)));
</script>
</body>
</html>
