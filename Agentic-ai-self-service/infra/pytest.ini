[pytest]
# Collect only tests/. Without this, a bare `python3 -m pytest -q` here fails with
# ~64 collection errors as soon as anyone has run a deploy or a synth: cdk.out/
# holds the bundled Lambda assets, and the vendored opentelemetry package inside
# them ships files named test_*.py that pytest happily tries to import. The
# directory is gitignored, so this never shows up in a fresh clone — it shows up
# the second time you run the command, which is the worse failure mode.
testpaths = tests
norecursedirs = cdk.out .venv node_modules
