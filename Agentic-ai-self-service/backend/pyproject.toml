[project]
name = "agentcore-workflow-backend"
version = "0.1.0"
description = "Backend for AgentCore Visual Workflow Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    # 1.43.66 is the first release with the GA `agent-registry-control` /
    # `agent-registry` service models (Agent Registry left the
    # `bedrock-agentcore` namespace at GA).
    "boto3>=1.43.66",
    "uvicorn>=0.32.0",
    "python-dotenv>=1.0.0",
    "mangum>=0.19.0",
]

[project.optional-dependencies]
dev = [
    # the live matrix mints its UI JWT with SRP (ADMIN_USER_PASSWORD_AUTH is not enabled on the app client): mint_jwt.py
    "pycognito>=2024.5.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "httpx>=0.28.0",
    "moto[dynamodb]>=5.0.0",
    "requests>=2.31.0",
    # Imported directly by tests/test_runtime_bundle_pins_match_the_test_environment.py to
    # parse the Requires-Dist/marker grammar out of the built bundles' own METADATA. It
    # arrives transitively via pytest today, but a test that imports it must declare it:
    # that file has no skip guard on the import, and the whole point of these lines is that
    # an undeclared dependency is a test which passes only where it happens to be installed.
    "packaging>=24.0",
    # The agent framework and the OpenTelemetry graph that the RUNTIME BUNDLE ships.
    # Declared here because tests/test_observability.py imports strands and drives its
    # real Tracer in a subprocess to prove the usage log carries no prompt, no response
    # and no bearer token. That test has no skip guard, so with these undeclared it is red
    # in a fresh CI environment and passes only on a machine that happens to have them --
    # which is how the signature drift below went unnoticed in the first place.
    #
    # Pinned, and pinned to the EXACT versions in backend/agentcore-deps-constraints.txt,
    # which are the versions the deployed bundle resolved to. Not `>=`: the whole reason
    # these lines exist is that `strands` moved `Tracer.end_model_invoke_span` from
    # (span, message, usage, stop_reason) at 1.9.1 to (span, message, usage, metrics,
    # stop_reason) at 1.56.0, so a test environment on a different version proves nothing
    # about the container. backend/tests/test_runtime_bundle_pins_match_the_test_environment.py
    # fails if these drift from the constraint file or from the interpreter running them.
    "strands-agents==1.56.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-semantic-conventions==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    # The lint gate over the exported CloudFormation template. Declared here rather
    # than left to whatever the developer happens to have installed, because
    # tests/test_cfn_export_contract.py skips the check when cfn-lint is missing — so
    # an undeclared dependency means the only lint that ever runs against our
    # customer-facing artifact silently does not run.
    #
    # Exact pin, for the same reason as ruff below and checkov above: cfn-lint's rule set
    # GROWS between minor releases, so `>=` means a new rule can turn this gate red on a
    # commit that changed nothing, and — worse for a gate we point a regulated customer
    # at — the strictness of the check silently changes without anyone deciding that it
    # should. `>=1.22.0` was resolving to 1.57.0 in CI while a developer machine here had
    # 1.55.1 on PATH; both pass today (verified: the 13 cfn-lint tests in
    # tests/test_cfn_export_contract.py pass under 1.57.0), so this pin records the
    # version the gate is calibrated against rather than fixing a present failure.
    # Bump it deliberately and re-run that file, the same as for checkov.
    "cfn-lint==1.57.0",
    # checkov is deliberately NOT here, even though the same test suite runs it.
    # checkov pins `boto3==1.35.49`; this package requires `boto3>=1.43.66` for the GA
    # Agent Registry service models. pip does not report that as a conflict — it
    # backtracks and installs an older checkov with a different rule set than the
    # accepted-findings baseline in that test was recorded against, so the policy gate
    # would quietly start checking something else. Install it isolated instead:
    #     pipx install checkov==3.3.1      # or: uv tool install checkov==3.3.1
    # The test finds it on PATH. See _require_scanner in
    # tests/test_cfn_export_contract.py.
    # Exact pin, unlike everything else here: a formatter's output changes between
    # minor releases, so `>=` would mean `ruff format --check` locally and in CI
    # could disagree while both were "satisfied". Must match the version installed by
    # the `lint` job in the repository-root workflow
    # .github/workflows/agentic-ai-self-service-ci.yml — note that is at the ROOT of
    # this monorepo, not under Agentic-ai-self-service/, because GitHub Actions reads
    # workflows only from the root. This pin is not hypothetical: a ruff installed
    # outside this extra reformats three files differently, so run
    # `pip install -e '.[dev]'` rather than relying on a system-wide ruff.
    "ruff==0.16.4",
]
deploy = [
    "bedrock-agentcore-starter-toolkit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests that perform real AWS API calls (deselect with '-m \"not integration\"')",
    # The autouse conftest fixture stubs tag discovery to "none found"; these tests run the real one.
    "real_gateway_lock: runs the gateway mutation lock and the teardown name hold against the test's own table instead of the in-memory default",
    "real_secret_discovery: runs the real ListSecrets-based secret discovery against the test's own fake",  # pragma: allowlist secret
    # checkov cannot be installed alongside this backend — it pins an older boto3 and pip
    # resolves the conflict by silently swapping in a checkov with a different rule set —
    # so it lives in its own isolated tool install and only the export-gate CI job has it.
    # Every other runner must deselect these or they fail for want of a binary they were
    # never meant to have.
    "policy_scan: needs checkov on PATH from an isolated install (deselect with '-m \"not policy_scan\"')",
    # Terraform is installed only in the customer-export CI gate. The general backend
    # job excludes this marker so the generated HCL is owned by the job that also owns
    # cfn-lint/checkov, rather than making every Python test runner install Terraform.
    "terraform_scan: needs Terraform CLI on PATH (deselect outside the export-gate job)",
    "shell_scan: needs ShellCheck on PATH (deselect outside the export-gate job)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
