# Pre-commit hooks for security scanning and code quality.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # --- Standard checks ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
        exclude: 'tsconfig\..*\.json$'
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # --- Secret detection ---
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Repo-root-relative on purpose. `sample-ai-agent-factory` is the git root and
        # this sample is a subdirectory of it; pre-commit chdirs to the git root before
        # running a hook, so the bare '.secrets.baseline' that sits next to this file
        # resolved to a path that does not exist and detect-secrets died with
        # "argument --baseline: Invalid path: .secrets.baseline" on every commit.
        # That failure looked like a secret finding and was routinely worked around
        # with --no-verify, which disabled every other hook here too.
        args: ['--baseline', 'Agentic-ai-self-service/.secrets.baseline']
        exclude: '(package-lock\.json|\.lock)$'

  # --- Python linting ---
  # Must stay equal to the `ruff==` pin in backend/pyproject.toml's dev extra and to
  # the version installed by .github/workflows/agentic-ai-self-service-ci.yml. A
  # formatter's output changes between minor releases, so a rev that drifts from those
  # means this hook reformats a file and CI then rejects its own formatting — the two
  # gates disagree while both report themselves satisfied.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format
