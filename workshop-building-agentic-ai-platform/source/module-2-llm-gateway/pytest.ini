[pytest]
# Collect only the offline unit/integration suites.
#
# `scripts/test_gateway.py` is a live smoke-test *script* run against a deployed
# gateway (`python scripts/test_gateway.py`, see content/module-2/step-4). Its
# functions take a `client` argument rather than a pytest fixture, so leaving it
# on the default collection path makes a bare `pytest` in this directory report
# 8 "fixture 'client' not found" errors. Scoping testpaths to tests/ keeps the
# script runnable as a script and `pytest` green.
testpaths = tests
