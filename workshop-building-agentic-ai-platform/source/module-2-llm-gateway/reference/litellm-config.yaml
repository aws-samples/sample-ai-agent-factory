# LiteLLM Proxy Configuration
# This file defines the models, guardrails, and settings for the LLM Gateway.
# It is loaded by the LiteLLM proxy at startup.
#
# All models use the Bedrock Converse API via IAM task role auth.
# Serverless Bedrock models are enabled automatically on first invocation
# (the console's "Model access" page was retired in October 2025). Anthropic
# models additionally need a one-time use case submission per account, done
# through the Model catalog playground as Module 2 step 2 describes.

model_list:
  # ─────────────────────────────────────────────────────────
  # Anthropic Claude
  # ─────────────────────────────────────────────────────────

  # Claude 4.6 (latest generation)
  - model_name: claude-opus-4.6
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: claude-sonnet-4.6
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # Claude 4.5
  - model_name: claude-opus-4.5
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-5-20251101-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: claude-haiku-4.5
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # Stable convenience aliases. These deliberately point at the latest
  # generation so agent code can pin `claude-sonnet` and follow model upgrades
  # without a code change. Superseded generations (Claude 4, 4.1) are not
  # listed: 4.5 and 4.6 above cover every capability they had.
  - model_name: claude-opus
    litellm_params:
      model: bedrock/global.anthropic.claude-opus-4-6-v1
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: claude-sonnet
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-6
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: claude-haiku
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # ─────────────────────────────────────────────────────────
  # Amazon Nova
  # ─────────────────────────────────────────────────────────
  - model_name: nova-pro
    litellm_params:
      model: bedrock/us.amazon.nova-pro-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: nova-lite
    litellm_params:
      model: bedrock/us.amazon.nova-lite-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: nova-2-lite
    litellm_params:
      model: bedrock/global.amazon.nova-2-lite-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: nova-2-sonic
    litellm_params:
      model: bedrock/amazon.nova-2-sonic-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # ─────────────────────────────────────────────────────────
  # Mistral AI
  # ─────────────────────────────────────────────────────────
  - model_name: mistral-large-3
    litellm_params:
      model: bedrock/mistral.mistral-large-3-675b-instruct
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: magistral-small
    litellm_params:
      model: bedrock/mistral.magistral-small-2509
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: ministral-14b
    litellm_params:
      model: bedrock/mistral.ministral-3-14b-instruct
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: ministral-8b
    litellm_params:
      model: bedrock/mistral.ministral-3-8b-instruct
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: ministral-3b
    litellm_params:
      model: bedrock/mistral.ministral-3-3b-instruct
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: mistral-large
    litellm_params:
      model: bedrock/mistral.mistral-large-2407-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # Lifecycle policy: this catalog lists only models Bedrock reports ACTIVE.
  # New accounts cannot adopt a Legacy model and EOL models fail at invoke
  # time, so neither belongs on a menu for a fresh workshop account. Removed
  # against the Model lifecycle (Legacy) page on 2026-11-08: Claude Sonnet 4.5
  # (EOL 2027-04-08); every Meta Llama (3.2 EOL 2026-07-07; 3, 3.1, 3.3 and 4
  # EOL 2027-03-30); Mistral 7B, Mixtral 8x7B and Devstral 2; DeepSeek R1 and
  # V3.1; Gemma 3; Nemotron Nano 9B/12B; Qwen3 Coder 30B/480B; MiniMax M2/M2.1;
  # Kimi K2 Thinking; GLM 4.7 and 4.7 Flash (all EOL 2027-03-30); Palmyra X4/X5
  # (EOL 2027-03-09/-21); Cohere Command R/R+ (EOL 2026-08-19). Re-check the
  # page before adding an alias: https://docs.aws.amazon.com/bedrock/latest/userguide/model-lifecycle-legacy.html

  # ─────────────────────────────────────────────────────────
  # DeepSeek
  # ─────────────────────────────────────────────────────────

  - model_name: deepseek-v3.2
    litellm_params:
      model: bedrock/deepseek.v3.2
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # ─────────────────────────────────────────────────────────
  # NVIDIA (Nemotron)
  # ─────────────────────────────────────────────────────────
  - model_name: nemotron-nano-30b
    litellm_params:
      model: bedrock/nvidia.nemotron-nano-3-30b
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # ─────────────────────────────────────────────────────────
  # Qwen
  # ─────────────────────────────────────────────────────────

  - model_name: qwen3-235b
    litellm_params:
      model: bedrock/qwen.qwen3-235b-a22b-2507-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: qwen3-32b
    litellm_params:
      model: bedrock/qwen.qwen3-32b-v1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # ─────────────────────────────────────────────────────────
  # Moonshot / Kimi
  # ─────────────────────────────────────────────────────────

  - model_name: kimi-k2.5
    litellm_params:
      model: bedrock/moonshotai.kimi-k2.5
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  # ─────────────────────────────────────────────────────────
  # OpenAI (open-source models on Bedrock)
  # ─────────────────────────────────────────────────────────
  - model_name: gpt-oss-120b
    litellm_params:
      model: bedrock/openai.gpt-oss-120b-1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

  - model_name: gpt-oss-20b
    litellm_params:
      model: bedrock/openai.gpt-oss-20b-1:0
      aws_region_name: os.environ/AWS_DEFAULT_REGION

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # upstream LiteLLM field name (not renamable); this is the proxy admin key

litellm_settings:
  cache: true
  num_retries: 2
  request_timeout: 60
  drop_params: true

# Guardrails are configured in Step 5 of the workshop.
# Uncomment after creating a Bedrock Guardrail:
