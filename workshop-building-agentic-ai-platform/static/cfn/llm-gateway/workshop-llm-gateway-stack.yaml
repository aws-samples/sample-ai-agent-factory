AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LLM Gateway — Module 2 of the Enterprise Agentic AI Platform workshop.
  Deploys LiteLLM Proxy on ECS Fargate with a PostgreSQL sidecar,
  internal ALB, API Gateway (HTTPS), EFS for data persistence, and an
  IAM task role for Amazon Bedrock (including Bedrock Guardrails).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  # Container image tags are pinned to specific released versions (instead of
  # floating tags like main-stable / 16) for supply-chain reproducibility.
  LiteLLMImageTag:
    Type: String
    # v1.88.6 carries the full set of LiteLLM advisory fixes affecting
    # < 1.84.0 (auth bypass via host-header injection, SQL injection in proxy
    # API-key verification, SSTI in /prompts/test, command execution via MCP
    # stdio test endpoints, the custom-code guardrail sandbox escape, plus the
    # earlier CVE-2026-47101/47102/40217 priv-esc/RCE) and additionally the
    # authenticated SSRF and provider-credential exfiltration via unvalidated
    # request-body routing parameters (GHSA-3cv6-jpf6-8222 / CVE-2026-84377),
    # whose first patch on this line is 1.88.6. This parameter, not
    # source/module-2-llm-gateway/requirements.txt, pins the proxy that runs:
    # the advisory is a proxy-server flaw, so the image is the exposure and the
    # requirements pin is only the client. Keep the two equal.
    #
    # DO NOT bump into 1.89.0-1.89.6. GHSA-3cv6-jpf6-8222 has nine affected
    # ranges and is re-patched per minor line (1.88.6, 1.89.7, 1.90.7, 1.91.5,
    # 1.92.2, 1.93.2, 1.94.3, 1.95.1, 1.96.2), so a NEWER tag is not
    # automatically a safer one.
    #
    # No `-stable` suffix: LiteLLM stopped publishing `vX.Y.Z-stable` tags after
    # the v1.83.x line, so `v1.88.6-stable` does not exist in the registry and
    # ECS fails with CannotPullContainerError ~20 minutes into the deploy.
    # scripts/verify-images.py checks every pin against its registry.
    Default: v1.88.6
    Description: >
      Tag for the LiteLLM Docker image
      (ghcr.io/berriai/litellm-database). Pinned to a specific
      release for supply-chain reproducibility.

  PostgresImageTag:
    Type: String
    # 16.12 (February 2026 security release) is the first 16.x release that fixes
    # CVE-2026-2003 / CVE-2026-2006 (info disclosure + arbitrary code execution
    # from missing multibyte-length validation); 16.7 and older do not carry the fix.
    Default: '16.12'
    Description: >
      PostgreSQL Docker image tag (use Debian-based, not Alpine, for EFS uid
      compatibility). Pinned to a specific minor version for supply-chain
      reproducibility.

  AdminKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      LiteLLM admin key (must start with sk-). If empty, auto-generated
      via Secrets Manager.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  GenerateAdminKey: !Equals [!Ref AdminKey, '']
  # The permissions boundary fences bounded roles to the deployment region plus
  # us-east-1 (global services: IAM, STS, CloudFront, Route 53, Marketplace).
  # When the stack itself is in us-east-1 the list collapses to one value.
  DeployedInUsEast1: !Equals [!Ref 'AWS::Region', us-east-1]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:
  #============================================================================
  # Workshop permissions boundary -- the ceiling every IAM role the workshop
  # creates runs under. Created in this stack because it is the first one both
  # contentspec.yaml and ./deploy-cfn.sh deploy; every other template references
  # it by its fixed name. It allows everything except unbounded IAM/Organizations
  # writes: a role may be created or modified only when it carries this same
  # boundary, nobody can remove or edit the boundary, and PassRole/reads stay
  # open. The ParticipantRole's CDK bootstrap (cdk bootstrap
  # --custom-permissions-boundary workshop-permissions-boundary) and FAST's CDK
  # app (@aws-cdk/core:permissionsBoundary context) attach it to every role they
  # create, which is what closes the create-role / attach-admin escalation path
  # that the scoped participant policies alone could not. See POLICY_NOTES.md.
  #============================================================================
  WorkshopPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: workshop-permissions-boundary
      Description: Permissions boundary for every IAM role the Agentic AI Platform workshop creates (CloudFormation templates, CDK bootstrap roles, FAST CDK roles).
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Ceiling for everything that is not identity/org/billing management,
          # fenced to the workshop regions exactly like the participant policies
          # (aws:RequestedRegion; global services report us-east-1). Workloads
          # keep everything they do today: all ten templates deploy into
          # ${AWS::Region}, and the only out-of-region calls are to global
          # services and to the Workshop Studio assets bucket in us-east-1.
          - Sid: AllowWorkshopRegionsExceptIdentityAndOrgManagement
            Effect: Allow
            NotAction:
              - iam:*
              - organizations:*
              - account:*
              - billing:*
              - sso:*
              - sso-directory:*
              # Model inference is granted by the next statement without the
              # Region fence: cross-Region inference profiles (global.*, us.*)
              # authorize the foundation model in the destination Region, and
              # a fenced boundary denied `bedrock:InvokeModel on
              # arn:aws:bedrock:::foundation-model/anthropic.claude-sonnet-4-6`
              # for the LLM Gateway task role (observed live, 2026-11-08).
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !If
                  - DeployedInUsEast1
                  - [us-east-1]
                  - [!Ref 'AWS::Region', us-east-1]
          # Same typed ARNs as the participant policies' BedrockInvokeModelsScoped;
          # the Region-less foundation-model form is what global.* profiles use.
          - Sid: BedrockInferenceFollowsCrossRegionProfiles
            Effect: Allow
            Action:
              # The Converse API is authorized through these two actions; there is
              # no bedrock:Converse IAM action (Access Analyzer: INVALID_ACTION).
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:*:inference-profile/*'
              - !Sub 'arn:${AWS::Partition}:bedrock:*:*:application-inference-profile/*'
          # IAM reads: ListRoles/ListPolicies/GetAccountSummary take no ARN, so
          # this is the one IAM statement that keeps Resource "*". Read-only.
          - Sid: IamReadOnly
            Effect: Allow
            Action:
              - iam:Get*
              - iam:List*
            Resource: '*'
          # PassRole, service-linked roles and role tags: roles in this account
          # only (service-linked roles live under role/aws-service-role/*).
          - Sid: IamPassRoleAndServiceLinkedRolesInThisAccount
            Effect: Allow
            Action:
              - iam:PassRole
              - iam:CreateServiceLinkedRole
              - iam:TagRole
              - iam:UntagRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*'
          # Customer-managed policy and instance-profile lifecycle, this account
          # only. The boundary's own ARN is carved out again by the Deny below.
          - Sid: IamPolicyAndInstanceProfileLifecycleInThisAccount
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:TagPolicy
              - iam:UntagPolicy
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagInstanceProfile
              - iam:UntagInstanceProfile
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/*'
          # Role writes: only when the role being written carries this boundary
          # (self-propagation: a bounded principal can only make more bounded
          # principals). Every action here supports iam:PermissionsBoundary.
          - Sid: RoleWritesOnlyWhenTheRoleCarriesThisBoundary
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePermissionsBoundary
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*'
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/workshop-permissions-boundary'
          - Sid: DenyRemovingTheBoundary
            Effect: Deny
            Action:
              - iam:DeleteRolePermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
            Resource: '*'
          - Sid: DenyChangingTheBoundaryPolicyItself
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/workshop-permissions-boundary'


  # =========================================================================
  # Networking
  # =========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.2.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.2.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.2.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.2.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.2.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # =========================================================================
  # Security Groups
  # =========================================================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from VPC (API Gateway VPC Link) to internal ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.2.0.0/16
          Description: HTTP from the API Gateway VPC Link inside this VPC only
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb-sg'

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: LiteLLM proxy port from the internal ALB
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ecs-sg'

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow NFS from ECS to EFS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: NFS from the LiteLLM ECS tasks
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-efs-sg'

  # =========================================================================
  # Secrets Manager
  # =========================================================================
  AdminKeySecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: "Workshop secrets use the AWS-managed Secrets Manager key; a customer-managed KMS CMK is out of scope for this ephemeral workshop."
    Condition: GenerateAdminKey
    Properties:
      Name: !Sub '${AWS::StackName}-admin-key'
      Description: LiteLLM admin key (raw value — consumers must prepend sk- prefix)
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 32
        IncludeSpace: false

  PostgresPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: "Workshop secrets use the AWS-managed Secrets Manager key; a customer-managed KMS CMK is out of scope for this ephemeral workshop."
    Properties:
      Name: !Sub '${AWS::StackName}-postgres-password'
      Description: PostgreSQL password for LiteLLM
      GenerateSecretString:
        ExcludePunctuation: true
        PasswordLength: 24

  # =========================================================================
  # EFS — PostgreSQL data persistence
  # =========================================================================
  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      # Workshop tag set explicitly: the ParticipantRole's EFS delete statement is
      # conditioned on aws:ResourceTag/Workshop (see POLICY_NOTES.md).
      FileSystemTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-efs'
        - Key: Workshop
          Value: AgentCore-Platform

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref FileSystem
      AccessPointTags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-postgres-ap'
        - Key: Workshop
          Value: AgentCore-Platform
      PosixUser:
        Uid: '999'
        Gid: '999'
      RootDirectory:
        Path: /postgres-data
        CreationInfo:
          OwnerUid: '999'
          OwnerGid: '999'
          Permissions: '700'

  # =========================================================================
  # IAM Roles
  # =========================================================================
  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Ref WorkshopPermissionsBoundary
      RoleName: !Sub '${AWS::StackName}-ecs-exec-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref PostgresPasswordSecret
                  - !If
                    - GenerateAdminKey
                    - !Ref AdminKeySecret
                    - !Ref AWS::NoValue

  ECSTaskRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >
              The BedrockAccess policy grants `aws-marketplace:Subscribe` and
              `aws-marketplace:ViewSubscriptions` with Resource '*' because the
              AWS Marketplace API does not support resource-level ARNs — there
              is no way to narrow the resource. The action is required on a
              fresh account for LiteLLM to complete the one-time subscription
              handshake for Marketplace-served Bedrock models. `Subscribe` is
              instead narrowed with the `aws-marketplace:ProductId` condition
              to the four Anthropic product IDs LiteLLM serves (Bedrock model
              cards); `ViewSubscriptions` has no condition key. A Condition
              like aws:CalledVia: bedrock.amazonaws.com would not apply because
              LiteLLM calls Marketplace directly from the ECS task, not via
              Bedrock. The Workshop Studio SCP on the sandbox account
              (self-hosted: dedicated disposable account + optional
              static/cfn/self-service-scp.json) remains the outer boundary.
    Properties:
      PermissionsBoundary: !Ref WorkshopPermissionsBoundary
      RoleName: !Sub '${AWS::StackName}-ecs-task-role-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:*::foundation-model/*'
                  # Region wildcard so cross-region inference profiles for ANY
                  # geo (us./eu./apac.) AND the geo-less global. profiles are
                  # invocable regardless of the region this stack deploys to.
                  # Account-scoped (inference profiles are account resources).
                  - !Sub 'arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                Resource: '*'
              # First-time invocation of Marketplace-served Bedrock models
              # (e.g., Claude 4.x Sonnet) requires these actions so LiteLLM
              # can complete the one-time subscription handshake account-wide.
              # AWS Marketplace does not support resource-level ARNs.
              - Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                Resource: '*'
              - Effect: Allow
                Action:
                  - aws-marketplace:Subscribe
                Resource: '*'
                Condition:
                  ForAnyValue:StringEquals:
                    # Marketplace product IDs from the Bedrock model cards: Claude
                    # Sonnet 4.6, Haiku 4.5, Opus 4.5, Opus 4.6 — the only Marketplace-
                    # served models LiteLLM is configured with. Amazon Nova, DeepSeek
                    # and Mistral have no Marketplace product and need no subscription.
                    aws-marketplace:ProductId:
                      - prod-ffvjxvh4ltq64
                      - prod-xdkflymybwmvi
                      - prod-jhuafngbly644
                      - prod-5ukwuglpt66kg
        - PolicyName: BedrockGuardrails
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:ApplyGuardrail
                  - bedrock:GetGuardrail
                  - bedrock:ListGuardrails
                  - bedrock:CreateGuardrail
                  - bedrock:UpdateGuardrail
                  - bedrock:DeleteGuardrail
                  - bedrock:CreateGuardrailVersion
                Resource:
                  - !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'

  # =========================================================================
  # ECS Cluster, Task Definition, Service
  # =========================================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${AWS::StackName}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 7

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-task'
      Cpu: '2048'
      Memory: '4096'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ECSExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Volumes:
        - Name: efs-postgres
          EFSVolumeConfiguration:
            FilesystemId: !Ref FileSystem
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EFSAccessPoint
              # EFS access controlled by security groups + access point uid/gid enforcement.
              # IAM auth requires additional task role permissions and EFS resource policy.
              IAM: DISABLED
      ContainerDefinitions:
        # --- LiteLLM Proxy ---
        - Name: litellm
          Image: !Sub 'ghcr.io/berriai/litellm-database:${LiteLLMImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          Environment:
            # DATABASE_URL uses resolve: because ECS Secrets only inject individual
            # secret values, not formatted connection strings. The password is from
            # a Secrets Manager secret that is not human-visible in the task definition.
            - Name: DATABASE_URL
              Value: !Sub 'postgresql://litellm:{{resolve:secretsmanager:${PostgresPasswordSecret}}}@localhost:5432/litellm'
            - Name: LITELLM_MASTER_KEY
              # Note: LITELLM_MASTER_KEY is the upstream LiteLLM env var name; our wrapper uses ADMIN_KEY terminology
              Value: !If
                - GenerateAdminKey
                - !Sub 'sk-{{resolve:secretsmanager:${AdminKeySecret}}}'
                - !Ref AdminKey
            - Name: LITELLM_SALT_KEY
              Value: !Sub '{{resolve:secretsmanager:${PostgresPasswordSecret}}}'
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: STORE_MODEL_IN_DB
              Value: 'True'
          DependsOn:
            - ContainerName: postgres
              Condition: HEALTHY
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: litellm
          HealthCheck:
            Command:
              - CMD-SHELL
              # http:// is intentional: this probe never leaves the container
              # (localhost loopback inside the Fargate task).
              - "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" || exit 1"
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 120

        # --- PostgreSQL Sidecar ---
        # EFS Access Points enforce uid/gid 999 (postgres user in Debian
        # images). EFS does NOT support chown, but docker-entrypoint.sh
        # only calls chown when running as root.
        # Fix: run the container as uid 999 (User directive) so the
        # entrypoint's chown block is skipped. chmod 700 ensures PGDATA
        # has the permissions initdb requires.
        - Name: postgres
          Image: !Sub 'postgres:${PostgresImageTag}'
          Essential: true
          User: '999:999'
          PortMappings:
            - ContainerPort: 5432
              Protocol: tcp
          EntryPoint:
            - 'bash'
            - '-c'
          Command:
            - |
              chmod 700 /var/lib/postgresql/data 2>/dev/null || true
              exec docker-entrypoint.sh postgres
          Environment:
            - Name: POSTGRES_USER
              Value: litellm
            - Name: POSTGRES_DB
              Value: litellm
            - Name: PGDATA
              Value: /var/lib/postgresql/data
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Ref PostgresPasswordSecret
          MountPoints:
            - SourceVolume: efs-postgres
              ContainerPath: /var/lib/postgresql/data
              ReadOnly: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: postgres
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'pg_isready -U litellm || exit 1'
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 30

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListenerHTTP
      - EFSMountTarget1
      - EFSMountTarget2
    Properties:
      ServiceName: !Sub '${AWS::StackName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: litellm
          ContainerPort: 4000
          TargetGroupArn: !Ref TargetGroup

  # =========================================================================
  # Application Load Balancer
  # =========================================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Scheme: internal
      Type: application
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      LoadBalancerAttributes:
        # Matters here specifically: ALBListenerApiGatewayRule routes on the
        # X-Apigw-Proto header, so malformed header fields must not reach it.
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-alb'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-tg'
      Port: 4000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health/liveliness
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # The only supported way in is API Gateway. This listener's *default* action
  # is a 301 to HTTPS; a request is forwarded to LiteLLM only when it carries
  # the `X-Apigw-Proto: https` header that HttpApiIntegration overwrites on
  # every request it proxies (see its RequestParameters below). An HTTPS
  # listener here is not an option — that needs an ACM certificate, which in
  # turn needs a custom domain the workshop does not have — but a plaintext
  # catch-all forward is not the only alternative. This shape is also what makes
  # Checkov CKV_AWS_2 and CKV_AWS_103 pass rather than be suppressed.
  #
  # `overwrite:` (not `append:`) matters: a caller inside the VPC cannot smuggle
  # its own value through API Gateway, because API Gateway replaces the header.
  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W55
            reason: >
              Protocol is HTTP because an HTTPS listener requires an ACM
              certificate and Workshop Studio accounts have no custom domain.
              The default action is a 301 redirect to HTTPS; only requests
              arriving through API Gateway (which terminates TLS) are
              forwarded. The ALB itself is internal to the VPC.
          - id: W56
            reason: >
              No SslPolicy configured because this is an HTTP redirect
              listener — see W55. No TLS policy applies.
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: /#{path}
            Query: '#{query}'
            StatusCode: HTTP_301

  ALBListenerApiGatewayRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListenerHTTP
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Apigw-Proto
            Values:
              - https
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # =========================================================================
  # API Gateway — HTTPS front door for the internal ALB
  # =========================================================================
  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Properties:
      Name: !Sub '${AWS::StackName}-vpclink'
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref ALBSecurityGroup

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      ProtocolType: HTTP
      # Workshop tag set explicitly: the ParticipantRole's API Gateway write
      # statement is conditioned on aws:ResourceTag/Workshop.
      Tags:
        Workshop: AgentCore-Platform

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: HTTP_PROXY
      IntegrationUri: !Ref ALBListenerHTTP
      IntegrationMethod: ANY
      ConnectionType: VPC_LINK
      ConnectionId: !Ref VpcLink
      PayloadFormatVersion: '1.0'
      # Stamps the header ALBListenerApiGatewayRule matches on. Without this
      # every request hits the listener's default action and gets a 301 instead
      # of reaching LiteLLM. `overwrite:` replaces any client-supplied value.
      RequestParameters:
        'overwrite:header.X-Apigw-Proto': https

  HttpApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: '$default'
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ProxyUrl:
    Description: LiteLLM Proxy URL (HTTPS via API Gateway)
    Value: !GetAtt HttpApi.ApiEndpoint
    Export:
      Name: !Sub '${AWS::StackName}-ProxyUrl'

  ApiGatewayId:
    Description: API Gateway HTTP API ID
    Value: !Ref HttpApi

  ALBDnsName:
    Description: Internal ALB DNS name (not publicly accessible)
    Value: !GetAtt ALB.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-ALBDnsName'

  # Note: LITELLM_MASTER_KEY is the upstream LiteLLM env var name; our wrapper uses ADMIN_KEY terminology
  AdminKeySecretArn:
    Condition: GenerateAdminKey
    Description: Secrets Manager ARN for the LiteLLM admin key
    Value: !Ref AdminKeySecret

  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PrivateSubnetIds:
    Description: Private subnet IDs (comma-separated)
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetIds'

  ECSClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster

  ECSServiceName:
    Description: ECS Service name
    Value: !GetAtt Service.Name
