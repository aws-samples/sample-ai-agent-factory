AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MCP Gateway Registry - Network Stack (Consolidated)
  Creates VPC, subnets, Regional NAT Gateway, security groups, and VPC endpoints.
  Uses AWS Regional NAT Gateway for simplified HA and cost savings.
  Deploys to the region specified by AWS::Region (this workshop locks this to us-west-2 via contentspec.yaml).

Parameters:
  EnvironmentName:
    Type: String
    Default: mcp-gateway
    Description: Name prefix for all resources

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC (matches Terraform default)

Resources:
  #============================================================================
  # VPC
  #============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  #============================================================================
  # Internet Gateway
  #============================================================================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  #============================================================================
  # Public Subnets (3 AZs) - /24 subnets (10.0.48.0/24, 10.0.49.0/24, 10.0.50.0/24)
  # Matches Terraform: cidrsubnet(var.vpc_cidr, 8, k + 48)
  #============================================================================
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.48.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-1
        - Key: subnet-type
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.49.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-2
        - Key: subnet-type
          Value: public

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 10.0.50.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-3
        - Key: subnet-type
          Value: public

  #============================================================================
  # Private Subnets (3 AZs) - /20 subnets (10.0.0.0/20, 10.0.16.0/20, 10.0.32.0/20)
  # Matches Terraform: cidrsubnet(var.vpc_cidr, 4, k)
  #============================================================================
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.0.0/20
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-1
        - Key: subnet-type
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.16.0/20
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-2
        - Key: subnet-type
          Value: private

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [2, !GetAZs '']
      CidrBlock: 10.0.32.0/20
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-3
        - Key: subnet-type
          Value: private

  #============================================================================
  # Regional NAT Gateway (single VPC-wide NAT with automatic HA)
  # Uses AWS Regional NAT Gateway feature for simplified management and cost savings
  # - Automatic multi-AZ expansion based on workload
  # - No public subnet required
  # - Automatic IP management
  #============================================================================
  RegionalNatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: InternetGatewayAttachment
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W999
            reason: >
              Uses AWS NAT Gateway's `AvailabilityMode: regional` feature
              which manages multi-AZ failover automatically without requiring
              a SubnetId. This is a newer NAT Gateway configuration that some
              scanners and older CloudFormation linters incorrectly flag as
              "missing SubnetId". The resource deploys successfully in
              us-west-2 (the workshop's target region) and has been verified
              across multiple deploy/teardown cycles. See
              https://docs.aws.amazon.com/AmazonVPC/latest/UserGuide/vpc-nat-gateway.html
    Properties:
      VpcId: !Ref VPC
      ConnectivityType: public
      AvailabilityMode: regional
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-nat-regional

  #============================================================================
  # Route Tables
  #============================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-public-rt

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet3

  # Single shared private route table for all AZs (uses Regional NAT Gateway)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-private-rt

  DefaultPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref RegionalNatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet3

  #============================================================================
  # Security Groups
  #============================================================================
  
  # CloudFront's origin-facing edge ranges, resolved at deploy time.
  #
  # The registry ALB is an internet-facing CloudFront origin, so its port-80
  # ingress cannot be a VPC-internal CIDR — but it does not have to be
  # 0.0.0.0/0 either. AWS publishes the edge ranges as the managed prefix list
  # `com.amazonaws.global.cloudfront.origin-facing`, which a security group can
  # reference directly. CloudFormation has no intrinsic for looking up an
  # AWS-managed prefix list, hence this custom resource.
  #
  # An earlier revision of this template claimed the prefix list was
  # unavailable in sandbox accounts, citing a `MainAlbSG CREATE_FAILED`. That
  # diagnosis was wrong. The list exists in every commercial region; the failure
  # was `RulesPerSecurityGroupLimitExceeded`, because a managed prefix-list
  # reference counts as *max-entries* rules against the 60-rule-per-group quota
  # (L-0EA8095F) and the CloudFront list is currently weighted 55. One reference
  # fits (55 + the 443 rule = 56); two do not. That is why only port 80 uses it.
  CloudFrontPrefixListLookupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-cf-prefix-list-lookup
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DescribeManagedPrefixLists
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeManagedPrefixLists
                # DescribeManagedPrefixLists does not support resource-level
                # permissions — the prefix list being looked up is AWS-managed
                # and has no account-scoped ARN. Read-only, no mutating actions.
                Resource: '*'

  CloudFrontPrefixListLookupLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-cf-prefix-list-lookup
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Role: !GetAtt CloudFrontPrefixListLookupRole.Arn
      Code:
        ZipFile: |
          # Copyright Amazon.com, Inc. or its affiliates. All Rights Reserved.
          # SPDX-License-Identifier: Apache-2.0
          import boto3
          import cfnresponse

          PREFIX_LIST_NAME = 'com.amazonaws.global.cloudfront.origin-facing'

          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  ec2 = boto3.client('ec2')
                  lists = ec2.describe_managed_prefix_lists(
                      Filters=[{'Name': 'prefix-list-name',
                                'Values': [PREFIX_LIST_NAME]}],
                  ).get('PrefixLists', [])
                  if not lists:
                      # Fail loudly rather than silently widening the security
                      # group to 0.0.0.0/0 — a silent fallback would look like a
                      # successful deploy while removing the control entirely.
                      raise RuntimeError(
                          f'Managed prefix list {PREFIX_LIST_NAME} not found in '
                          f'this region. The registry ALB security group cannot '
                          f'be scoped to CloudFront edges without it.'
                      )
                  pl = lists[0]
                  print(f"Resolved {PREFIX_LIST_NAME} -> {pl['PrefixListId']} "
                        f"(max entries {pl.get('MaxEntries')})")
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'PrefixListId': pl['PrefixListId'],
                      'MaxEntries': pl.get('MaxEntries'),
                  })
              except Exception as e:
                  print(f'Error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED,
                                   {'Error': str(e)})

  CloudFrontPrefixList:
    Type: Custom::CloudFrontPrefixList
    Properties:
      ServiceToken: !GetAtt CloudFrontPrefixListLookupLambda.Arn

  # Main ALB Security Group
  MainAlbSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W2
            reason: >
              Port 443 accepts 0.0.0.0/0 by design: MainAlbHttpsListener only
              exists when a BaseDomain and ACM certificate are supplied
              (compute-stack `HasDnsConfig`), and that listener is meant to
              serve the public internet directly over TLS. The port-80 origin
              path is restricted to CloudFront's managed prefix list.
    Properties:
      GroupName: !Sub ${EnvironmentName}-main-alb
      GroupDescription: Security group for main ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Port 80 is the CloudFront origin path (MainCloudFrontDistribution uses
        # OriginProtocolPolicy: http-only against HTTPPort 80). Scoping it to the
        # CloudFront edge prefix list means the ALB's plaintext listener is not
        # reachable from the internet at large, and compute-stack's
        # MainAlbHttpListener only forwards requests that also carry the
        # X-Cloudfront-Forwarded-Proto header CloudFront stamps on origin
        # requests. Everything else gets a 301 to HTTPS.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !GetAtt CloudFrontPrefixList.PrefixListId
          Description: HTTP from CloudFront origin-facing edges only
        # Port 443 serves MainAlbHttpsListener, which compute-stack creates only
        # under HasDnsConfig (a real domain + ACM certificate). Public by intent.
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS direct to the ALB when a custom domain and ACM certificate are configured
        # No ingress for 8888 (auth-server) or 7860 (Gradio). Those listeners
        # exist only to keep their ECS target groups associated with a load
        # balancer; see the comment above MainAlbAuthListener in compute-stack.
        # East-west traffic uses ECS Service Connect, not the ALB.
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-main-alb

  # ECS Tasks Security Group
  EcsTasksSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_382
            comment: "ECS tasks pull container images from public ECR/Docker Hub and call AWS APIs via NAT; open egress is required for the workshop. Restrict egress to VPC endpoints + specific CIDRs in production."
    Properties:
      GroupName: !Sub ${EnvironmentName}-ecs-tasks
      GroupDescription: Security group for ECS tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ecs-tasks

  EcsTasksIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsTasksSG
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref MainAlbSG
      Description: HTTP from ALB

  EcsTasksIngressFromAlb443:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsTasksSG
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref MainAlbSG
      Description: HTTPS from ALB

  EcsTasksIngressFromAlb7860:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsTasksSG
      IpProtocol: tcp
      FromPort: 7860
      ToPort: 7860
      SourceSecurityGroupId: !Ref MainAlbSG
      Description: Gradio from ALB

  EcsTasksIngressFromAlb8888:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsTasksSG
      IpProtocol: tcp
      FromPort: 8888
      ToPort: 8888
      SourceSecurityGroupId: !Ref MainAlbSG
      Description: Auth server from ALB

  # Self-referencing rule: Allow all ECS tasks to communicate with each other
  # Required for inter-service communication (Registry <-> Auth, MCP servers, etc.)
  EcsTasksIngressFromSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsTasksSG
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref EcsTasksSG
      Description: Allow all traffic between ECS tasks in same security group

  # Main ALB egress to the ECS tasks
  MainAlbEgressToEcs:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref MainAlbSG
      IpProtocol: '-1'
      DestinationSecurityGroupId: !Ref EcsTasksSG
      Description: All traffic to ECS tasks

  McpServersSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_382
            comment: "MCP server tasks pull container images from public ECR/Docker Hub and call AWS APIs via NAT; open egress is required for the workshop. Restrict egress to VPC endpoints + specific CIDRs in production."
    Properties:
      GroupName: !Sub ${EnvironmentName}-mcp-servers
      GroupDescription: Security group for MCP server tasks
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-mcp-servers

  # Allow ECS tasks to communicate with MCP servers
  McpServersIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref McpServersSG
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 9001
      SourceSecurityGroupId: !Ref EcsTasksSG
      Description: MCP ports from ECS tasks

  #============================================================================
  # Observability Security Groups (Grafana OSS, Metrics Service)
  #============================================================================

  # Grafana OSS Security Group - allows traffic from ALB on port 3000
  GrafanaSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_382
            comment: "Grafana queries AMP and CloudWatch endpoints via NAT; open egress is required for the workshop. Restrict egress to VPC endpoints + specific CIDRs in production."
    Properties:
      GroupName: !Sub ${EnvironmentName}-grafana
      GroupDescription: Security group for Grafana OSS ECS service
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref MainAlbSG
          Description: Grafana UI from ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (for AMP queries, CloudWatch)
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-grafana

  # Allow ALB to route to Grafana on port 3000
  MainAlbEgressToGrafana:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref MainAlbSG
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref GrafanaSG
      Description: ALB to Grafana

  # Metrics Service Security Group - allows traffic from ECS tasks and ADOT scraping
  MetricsServiceSG:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_382
            comment: "metrics-service writes to the AMP remote-write endpoint via NAT; open egress is required for the workshop. Restrict egress to VPC endpoints + specific CIDRs in production."
    Properties:
      GroupName: !Sub ${EnvironmentName}-metrics-service
      GroupDescription: Security group for metrics-service ECS task
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Allow metrics API access from ECS tasks (registry, auth-server)
        - IpProtocol: tcp
          FromPort: 8890
          ToPort: 8890
          SourceSecurityGroupId: !Ref EcsTasksSG
          Description: Metrics API from ECS tasks
        # Allow Prometheus scraping from ADOT (also in EcsTasksSG)
        - IpProtocol: tcp
          FromPort: 9465
          ToPort: 9465
          SourceSecurityGroupId: !Ref EcsTasksSG
          Description: Prometheus scraping from ADOT
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-metrics-service

  #============================================================================
  # VPC Endpoints
  #============================================================================
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

#============================================================================
# Outputs
#============================================================================
Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${EnvironmentName}-VpcId

  VpcCidr:
    Description: VPC CIDR block
    Value: !Ref VpcCidr
    Export:
      Name: !Sub ${EnvironmentName}-VpcCidr

  PublicSubnets:
    Description: Public subnet IDs
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
    Export:
      Name: !Sub ${EnvironmentName}-PublicSubnets

  PrivateSubnets:
    Description: Private subnet IDs
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnets

  PrivateSubnet1:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnet1

  PrivateSubnet2:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnet2

  PrivateSubnet3:
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub ${EnvironmentName}-PrivateSubnet3

  MainAlbSecurityGroupId:
    Description: Main ALB Security Group ID
    Value: !Ref MainAlbSG
    Export:
      Name: !Sub ${EnvironmentName}-MainAlbSG


  EcsTasksSecurityGroupId:
    Description: ECS Tasks Security Group ID
    Value: !Ref EcsTasksSG
    Export:
      Name: !Sub ${EnvironmentName}-EcsTasksSG



  McpServersSecurityGroupId:
    Description: MCP Servers Security Group ID
    Value: !Ref McpServersSG
    Export:
      Name: !Sub ${EnvironmentName}-McpServersSG

  GrafanaSecurityGroupId:
    Description: Grafana OSS Security Group ID
    Value: !Ref GrafanaSG
    Export:
      Name: !Sub ${EnvironmentName}-GrafanaSG

  MetricsServiceSecurityGroupId:
    Description: Metrics Service Security Group ID
    Value: !Ref MetricsServiceSG
    Export:
      Name: !Sub ${EnvironmentName}-MetricsServiceSG

