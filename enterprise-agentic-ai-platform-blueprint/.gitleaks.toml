# .gitleaks.toml — secret-scan configuration for this blueprint.
#
# Extends the gitleaks default rule set with the leakage classes that matter to
# this repository and are safe to describe in public: AWS account IDs outside
# the documented placeholder set, and developer-specific absolute paths.
#
# Paired with scripts/scrub-security-leakage.sh for defence in depth: gitleaks
# catches regex-based secrets (AWS access keys, generic API keys, tokens); the
# script adds the account-ID and developer-path rules and runs without a
# gitleaks binary.
#
# Match the shape, not the value. NEVER encode a real account ID, a developer
# alias, an internal hostname, an internal tool or system name, or an event id
# in a rule here: this file is allow-listed against itself, so such a value
# would be published and never flagged. Site-specific literals belong in the
# untracked deny-list that scrub-security-leakage.sh reads instead
# (.scrub-denylist.local).

title = "enterprise-agentic-ai-platform-blueprint gitleaks config"

[extend]
# Pull in every rule gitleaks ships by default; we only add on top.
useDefault = true

# -- Blueprint-specific custom rules ----------------------------------------

[[rules]]
id = "aws-account-id"
description = "Bare 12-digit AWS account ID outside the documented placeholder set"
regex = '''\b[0-9]{12}\b'''
tags = ["aws", "account-id"]

  [rules.allowlist]
  description = "Documented placeholders: AWS canonical example, low-number examples, repeated-digit test fixtures."
  regexes = [
    '''\b123456789012\b''',
    '''\b0{10}[0-9]{2}\b''',
    '''\b(0{12}|1{12}|2{12}|3{12}|4{12}|5{12}|6{12}|7{12}|8{12}|9{12})\b''',
  ]

[[rules]]
id = "developer-absolute-path"
description = "Hardcoded absolute developer home path — leaks a local username"
regex = '''/(Users|home)/[A-Za-z0-9._-]+'''
tags = ["internal", "pii"]

# -- Allow-listed paths ----------------------------------------------------

[allowlist]
description = "Files that carry the patterns above literally, by design."
paths = [
  '''scripts/scrub-security-leakage\.sh''',
  '''\.gitleaks\.toml''',
]
