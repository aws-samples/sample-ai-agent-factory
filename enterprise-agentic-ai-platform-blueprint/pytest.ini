[pytest]
testpaths = blueprints handlers packages scripts tests
python_files = test_*.py
addopts = -q --tb=short --import-mode=importlib
markers =
    integration: live-AWS integration tests (D-03 cross-account path). Require AWS creds for both platform + workload accounts; skip otherwise.
    teardown: post-destroy residue checks. Run after cdk destroy on both D-03 stacks.
